name: Build and release
run-name: Validate and package ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      browser:
        description: Run the complete Linux browser suite
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vista-build-${{ github.ref }}-${{ github.event_name }}-${{ inputs.browser }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  GOWORK: "off"
  CGO_ENABLED: "0"
  CI_GO_VERSION: "1.27.3"
  CI_NODE_VERSION: "26.4.0"
  VISTA_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
  VISTA_NO_BROWSER: "1"
  VISTA_WEBSEARCH_EXA_ENDPOINT: http://127.0.0.1:1/exa
  VISTA_WEBSEARCH_FIRECRAWL_ENDPOINT: http://127.0.0.1:1/firecrawl
  VISTA_WEBSEARCH_PARALLEL_ENDPOINT: http://127.0.0.1:1/parallel

jobs:
  core:
    name: Go and frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.CI_GO_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check release tag and artifact safeguards
        run: |
          python3 -m unittest discover -s scripts -p 'ci_*_test.py'
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 scripts/ci_release.py --version "$VISTA_BUILD_VERSION" --source "$GITHUB_SHA" --check-tag
          fi
      - name: Check Go, race safety, frontend types and units
        run: make test go frontend
      - name: Check bundled license notices
        run: node scripts/update_licenses.mjs --check
      - name: Check generated frontend files
        run: git diff --exit-code

  native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux/amd64
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux/arm64
            artifact: linux-arm64
          - runner: windows-2025
            target: windows/amd64
            artifact: windows-amd64
          - runner: windows-11-arm
            target: windows/arm64
            artifact: windows-arm64
          - runner: macos-15-intel
            target: darwin/amd64
            artifact: darwin-amd64
          - runner: macos-15
            target: darwin/arm64
            artifact: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.CI_GO_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build, unpack and run the native application
        if: runner.os != 'Windows'
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: python scripts/ci_native.py --target "$NATIVE_TARGET" --version "$VISTA_BUILD_VERSION"
        shell: bash
      - name: Build, unpack and run the Windows desktop application
        if: runner.os == 'Windows'
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: ./scripts/ci_windows.ps1 -Target $env:NATIVE_TARGET -Version $env:VISTA_BUILD_VERSION
        shell: pwsh
      - name: Retain native evidence and validation archives
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.artifact }}
          path: |
            .vista/ci/native/*/report.json
            .vista/ci/native/*/native-tests.jsonl
            .vista/ci/native/*/dist/*
            .vista/ci/windows/desktop.log
            .vista/ci/windows/result.json
            .vista/ci/windows/bootstrap*.log
          include-hidden-files: true
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  browser:
    name: Linux browser ${{ matrix.project }}
    if: ${{ github.event_name == 'push' || inputs.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile-portrait, mobile-landscape]
    env:
      BROWSER_PROJECT: ${{ matrix.project }}
      PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/web/.vista/test-state/browser-report.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.CI_GO_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the locked browser runtime
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log("VISTA_CHROME=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Run viewport browser checks
        run: make test e2e E2E_ARGS="--project=$BROWSER_PROJECT --max-failures=0 --workers=2 --reporter=list,json --global-timeout=1800000"
      - name: Retain the browser result summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.project }}
          path: web/.vista/test-state/browser-report.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
      - name: Collect failed-test diagnostic attachments
        if: ${{ failure() }}
        run: python3 scripts/ci_browser_artifacts.py
      - name: Retain failure traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ matrix.project }}
          path: .vista/ci/browser-failures/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn

  release:
    name: Publish tested archives
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [core, native, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: .vista/ci/artifacts
      - name: Verify tested archives and combine checksums
        run: python3 scripts/ci_release.py --version "$VISTA_BUILD_VERSION" --source "$GITHUB_SHA"
      - name: Create release with the tag's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VISTA_BUILD_VERSION" .vista/ci/release/* --verify-tag --title "$VISTA_BUILD_VERSION" --notes-from-tag
